<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이스 아메리카노</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#231d1a; --fg:#efe7da; --muted:#a89a88; --accent:#e2b457; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; overflow:hidden; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px; }
  canvas { display:block; border-radius:6px; box-shadow:0 12px 40px rgba(0,0,0,.55); background:#d6ccbb; }
  #bar { display:flex; align-items:center; gap:10px; min-width:260px; }
  #play { width:40px; height:40px; flex:none; border:0; border-radius:50%; background:var(--accent); color:#231d1a;
    font-size:16px; cursor:pointer; display:grid; place-items:center; }
  #play:focus-visible, #seek:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  #seek { flex:1; accent-color:var(--accent); cursor:pointer; min-width:0; }
  #time { font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); width:74px; text-align:right; flex:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="bar">
    <button id="play" aria-label="재생/일시정지">❚❚</button>
    <input id="seek" type="range" min="0" max="22" step="0.01" value="0" aria-label="재생 위치">
    <span id="time">0.00 / 22</span>
  </div>
</div>
<script>
/* =====================================================================
   0. 설정 — 문구 · 색 · 배치 · 장면 시간표 · 카메라  (여기만 고치면 됨)
   ===================================================================== */
const TEXT = {

  labels:    ['볶은 원두', '곱게 갈기', '에스프레소 추출', '얼음 + 찬물', '완성!'],

  ink:'#2E2622', doodle:'#8C7862',
  bean:'#6B4127', beanCrease:'#3A2215', ground:'#5A3620', crema:'#C58E57',
  ice:'#CEE8F4', iceLine:'#4F7F9A', water:'rgba(214,236,247,0.80)', coffee:'74,43,24',
  highlight:'rgba(255,224,52,0.62)', check:'#B2432F', retrace:'#7A4A28',

};

// 종이 위 좌표(가운데 기준) · 크기 · 쓰기 시작 시각
const LAYOUT = {

  labels: [
             { x:430, y:1375, size:74,  t:3.05 },
             { x:760, y:2235, size:74,  t:6.3  },
             { x:450, y:3122, size:64,  t:10.6 },
             { x:812, y:3412, size:62,  t:14.45},
             { x:620, y:4222, size:76,  t:17.3 },
  ],

// 장면 시간표 (초)
const TL = {
  beanFall:[0.9,1.28], beanTravel:[1.62,2.9],
  bowlDraw:[2.05,2.95], steam:3.3, bowlTilt:[4.15,4.55],
  grinderDraw:[4.45,5.45], crank:[5.75,7.65], grounds:[6.05,8.1],
  machine:[8.25,10.0], espresso:[10.15,11.75],
  shotWalk:[12.0,12.62], glassDraw:[12.3,12.95], ice:[13.1,13.45,13.8],
  water:[14.2,15.15], pour:[15.35,16.95], straw:[17.25,17.55], drops:[17.55,18.15],

// 카메라: [시각, 바라보는 x, y, 확대, 움직이는 방식]
//  slow=천천히  whip=휙(짧게, 도착 시 멈칫, 모션블러)  accel=가속  snap=확 줌인
const CAMERA = [
  [0,     520,  380, 1.42, ''     ],
  [1.9,   545,  470, 1.26, 'slow' ],
  [2.55,  445, 1060, 1.16, 'whip' ],
  [4.35,  450, 1070, 1.24, 'slow' ],
  [5.1,   640, 1890, 1.20, 'accel'],
  [7.75,  650, 1930, 1.31, 'slow' ],
  [8.3,   450, 2790, 1.15, 'whip' ],
  [10.0,  445, 2805, 1.23, 'slow' ],
  [10.45, 448, 2960, 1.55, 'snap' ],
  [11.95, 448, 2972, 1.63, 'slow' ],
  [12.6,  620, 3790, 1.06, 'whip' ],
  [15.3,  622, 3800, 1.13, 'slow' ],

  [18.85, 620, 2240, 0.43, 'accel'],

  [20.12, 620, 4000, 1.07, 'snap' ],

const PARALLAX = { pos:0.82, zoom:0.72 };   // 뒤 낙서 층

/* =====================================================================
   1. 수학 도구
   ===================================================================== */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, s) => a + (b - a) * s;
const prog  = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inQ: s => s * s,
  inC: s => s * s * s,
  outQ: s => 1 - (1 - s) * (1 - s),
  outC: s => 1 - Math.pow(1 - s, 3),
  io: s => -(Math.cos(Math.PI * s) - 1) / 2,
  ioC: s => s < .5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2,
  ioQ4: s => s < .5 ? 8 * s ** 4 : 1 - Math.pow(-2 * s + 2, 4) / 2,
  outBack: s => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(s - 1, 3) + c1 * Math.pow(s - 1, 2); },
  outExpo: s => s >= 1 ? 1 : 1 - Math.pow(2, -10 * s),
  // 휙: 빠르게 가서 살짝 넘어간 뒤 멈칫하며 되돌아옴
  whip: s => { const k = .58; if (s < k) return 1.035 * E.ioC(s / k); return 1.035 - .035 * E.io((s - k) / (1 - k)); },
};
function rnd(a, b) { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453123; return x - Math.floor(x); }

/* =====================================================================
   2. 선 모양 만들기 (점 배열)
   ===================================================================== */
function dense(pts, step = 9) {
  const o = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let k = 1; k <= n; k++) o.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
  }
  return o;
}
const G = {
  line: (...p) => dense(p),
  poly: (p, step) => dense(p, step),
  rect: (x0, y0, x1, y1) => dense([[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0 - 3]]),
  bez(p0, p1, p2, p3) {
    const o = [];
    for (let k = 0; k <= 48; k++) {
      const s = k / 48, u = 1 - s;
      o.push([u*u*u*p0[0] + 3*u*u*s*p1[0] + 3*u*s*s*p2[0] + s*s*s*p3[0],
              u*u*u*p0[1] + 3*u*u*s*p1[1] + 3*u*s*s*p2[1] + s*s*s*p3[1]]);
    }
    return dense(o);
  },
  ell(cx, cy, rx, ry, a0 = -2.1, sweep = Math.PI * 2 + 0.35) {
    const n = Math.max(10, Math.ceil(Math.PI * (rx + ry) * sweep / (Math.PI * 2) / 8));
    const o = [];
    for (let k = 0; k <= n; k++) { const a = a0 + sweep * k / n; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
    return o;
  },
  chain(...arrs) { const o = []; arrs.forEach((a, i) => o.push(...(i ? a.slice(1) : a))); return o; },
};
// 로컬 스케일 → 회전 → 월드 스케일 → 이동
function xf(pts, { x = 0, y = 0, r = 0, s = 1, wx = 1, wy = 1 } = {}) {
  const c = Math.cos(r), sn = Math.sin(r);
  return pts.map(([px, py]) => { px *= s; py *= s; return [x + (px * c - py * sn) * wx, y + (px * sn + py * c) * wy]; });
}
function lengths(p) { const c = [0]; for (let i = 1; i < p.length; i++) c.push(c[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1])); return c; }
function sub(pts, a, b) {
  if (a <= 0 && b >= 1) return pts;
  const c = lengths(pts), L = c[c.length - 1], A = a * L, B = b * L, out = [];
  const at = (i, X) => { const f = (X - c[i - 1]) / ((c[i] - c[i - 1]) || 1); return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)]; };
  for (let i = 0; i < pts.length; i++) {
    if (c[i] < A) continue;
    if (!out.length && i > 0) out.push(at(i, A));
    if (c[i] > B) { if (i > 0) out.push(at(i, B)); break; }
    out.push(pts[i]);
  }
  return out;
}
function makePath(pts) {
  const cum = lengths(pts), len = cum[cum.length - 1];
  return { pts, len, at(u) {
    const X = clamp(u) * len; let lo = 1, hi = cum.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < X) lo = m + 1; else hi = m; }
    const i = Math.max(1, lo), f = (X - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
    return { x: lerp(pts[i - 1][0], pts[i][0], f), y: lerp(pts[i - 1][1], pts[i][1], f),
             a: Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]) };
  } };
}

/* =====================================================================
   3. 연필 선 · 글자 그리기
   ===================================================================== */
const cv = document.getElementById('cv');
const main = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const ctx = buf.getContext('2d');
let VAR = 0;   // 떨림 3벌 중 몇 번째 (1초 12번 교대)

// 손그림 선: 점마다 ±jit 흔들림, 진한 선 + 절반 굵기 45% 선, p0~p 구간만 그림
function ink(pts, o = {}) {
  const { p = 1, p0 = 0, id = 1, color = COLOR.ink, w = 4, jit = 2, alpha = 1, dash = 0, over = true } = o;
  if (p <= p0 + 1e-4 || !pts || pts.length < 2 || alpha <= 0) return;
  const P = sub(pts, p0, p), n = P.length;
  if (n < 2) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color;
  for (let pass = 0; pass < (over ? 2 : 1); pass++) {
    const seed = id * 1.618 + pass * 57.3 + VAR * 13.1;
    ctx.beginPath();
    let dist = 0, down = false;
    for (let i = 0; i < n; i++) {
      const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
      let nx = a[1] - b[1], ny = b[0] - a[0]; const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
      const off = (rnd(seed, i) - .5) * 2 * jit;
      const x = P[i][0] + nx * off, y = P[i][1] + ny * off;
      if (i > 0) dist += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
      if (!dash || Math.floor(dist / dash) % 2 === 0) { if (!down) { ctx.moveTo(x, y); down = true; } else ctx.lineTo(x, y); }
      else down = false;
    }
    ctx.globalAlpha = alpha * (pass ? 0.45 : 1);
    ctx.lineWidth = pass ? w / 2 : w;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function fillPts(pts, color, alpha = 1) {
  if (alpha <= 0 || pts.length < 3) return;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1;
}
function setFont(size) { ctx.font = `700 ${size}px Gaegu, "Comic Sans MS", cursive`; }
// 왼쪽부터 1초에 10칸씩 계단처럼 써짐
function write(str, x, y, size, t0, t, o = {}) {
  const chars = Array.from(str);
  setFont(size);
  const full = ctx.measureText(str).width;
  const left = o.left ?? x - full / 2;
  const n = t < t0 ? 0 : Math.min(chars.length, Math.floor((t - t0) * 10) + 1);
  if (n > 0) {
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = o.color || COLOR.ink; ctx.globalAlpha = o.alpha ?? 1;
    ctx.fillText(chars.slice(0, n).join(''), left + (rnd(VAR, size) - .5) * 1.4, y + (rnd(VAR + 5, size) - .5) * 1.4);
    ctx.globalAlpha = 1;
  }
  return { left, width: full, done: t0 + chars.length / 10 };
}

/* =====================================================================
   4. 고정 도형 (종이 위 좌표)
   ===================================================================== */
// 경로선
const P1 = makePath(G.chain(G.bez([930, 362], [990, 380], [960, 560], [800, 680]),
                            G.bez([800, 680], [640, 800], [380, 830], [458, 982])));
const PB = makePath(G.bez([592, 1030], [720, 1090], [720, 1500], [660, 1775]));
const P2 = makePath(G.bez([660, 2026], [660, 2100], [520, 2080], [485, 2168]));
const P3 = makePath(G.bez([480, 2190], [820, 2330], [790, 2820], [450, 2900]));
const P4 = makePath(G.bez([450, 2955], [640, 3250], [260, 3600], [440, 3920]));
const TRAILS = [P1, PB, P2, P3, P4];

// 원두
const BEAN = { out: G.ell(0, 0, 24, 17, -2.2, Math.PI * 2 + .3), crease: G.bez([-17, 4], [-6, -9], [6, 9], [17, -4]) };
function bean(st, id) {
  if (!st || st.s <= 0.02) return;
  const T = { x: st.x, y: st.y, r: st.r, s: st.s, wx: st.wx || 1, wy: st.wy || 1 };
  const o = xf(BEAN.out, T);
  fillPts(o, COLOR.bean);
  ink(o, { id: id * 3 + 1, jit: 1.5 });
  ink(xf(BEAN.crease, T), { id: id * 3 + 2, color: COLOR.beanCrease, w: 3.4, jit: 1.2, over: false });
}

// 그릇 (피벗 = 오른쪽 입구 580,1040 기준 로컬 좌표)

  rim: G.ell(-130, 0, 130, 26), body: G.bez([-260, 0], [-255, 118], [-5, 118], [0, 0]),
  foot: G.line([-180, 93], [-80, 93]), hatch: [0, 1, 2].map(k => G.line([-60 + k * 16, 20 + k * 6], [-30 + k * 12, 70 - k * 4])) };

              [-60, -34, .9], [-20, -38, -1], [20, -36, .4], [58, -32, -.8], [8, -58, 0]];

// 그라인더

  hopRim: G.ell(660, 1790, 70, 13), hopL: G.line([590, 1790], [622, 1842]), hopR: G.line([730, 1790], [698, 1842]),
  hopFill: [[590, 1790], [730, 1790], [698, 1842], [622, 1842]],

const PF = {
  rim: G.line([-62, 0], [62, 0]), basket: G.bez([-62, 0], [-58, 50], [58, 50], [62, 0]),
  hA: G.line([-60, 10], [-205, 18]), hB: G.line([-58, 28], [-205, 34]), cap: G.ell(-207, 26, 7, 9),
  hFill: [[-60, 10], [-205, 18], [-205, 34], [-58, 28]],

// 에스프레소 머신
const MC = {
  body: G.rect(270, 2560, 630, 2742), bodyFill: [[270, 2560], [630, 2560], [630, 2742], [270, 2742]],
  top: G.line([290, 2590], [610, 2590]), gauge: G.ell(340, 2655, 28, 28), needle: G.line([340, 2655], [357, 2637]),

  s1: G.line([-8, -14], [-8, -40]), s2: G.line([8, -14], [8, -40]), knob: G.ell(0, -52, 14, 13) };
// 샷잔 (가운데 기준)
const SG = { left: G.line([-38, -40], [-31, 40]), bottom: G.line([-31, 40], [31, 40]), right: G.line([31, 40], [38, -40]),
  rim: G.ell(0, -40, 38, 6), base: G.line([-30, 46], [30, 46]), fill: [[-38, -40], [38, -40], [31, 40], [-31, 40]] };
// 큰 유리잔

  left: G.line([515, 3690], [535, 3970]), right: G.line([765, 3690], [745, 3970]), bottom: G.line([535, 3970], [745, 3970]),
  rim: G.ell(640, 3690, 125, 14), base: G.line([540, 3984], [740, 3984]),

// 얼음
const CUBE = { out: G.poly([[-30, -27], [27, -31], [31, 26], [-27, 30], [-30, -27]], 8),
  f1: G.line([-17, -14], [-4, -19]), f2: G.line([12, 19], [20, 7]) };
const ICE = [{ x: 588, y: 3930, r: .15 }, { x: 692, y: 3926, r: -.22 }, { x: 636, y: 3868, r: .4 }];
// 빨대 (아래 끝 기준)
const ST = { L: G.line([-8, 0], [-8, -440]), R: G.line([8, 0], [8, -440]), top: G.ell(0, -440, 8, 4),

  const L = shotLevel(t);
  if (L > .01 && Math.abs(P.r) < .6) {
    const yS = 38 - 72 * L, hS = 31 + 7 * (40 - yS) / 80;
    fillPts(xf([[-hS, yS], [hS, yS], [31, 38], [-31, 38]], T), COLOR.beanCrease);
    const cr = 7 * prog(t, 10.5, 11.4);
    if (cr > .3) { const h2 = 31 + 7 * (40 - yS - cr) / 80; fillPts(xf([[-hS, yS], [hS, yS], [h2, yS + cr], [-h2, yS + cr]], T), COLOR.crema); }
  }
  ink(xf(SG.left, T), { p: q(9.8, 9.9), id: 181 });
  ink(xf(SG.bottom, T), { p: q(9.88, 9.95), id: 182 });
  ink(xf(SG.right, T), { p: q(9.93, 10.03), id: 183 });
  ink(xf(SG.rim, T), { p: q(10.0, 10.12), id: 184 });
  ink(xf(SG.base, T), { p: q(10.05, 10.15), id: 185 });
}
function drawEspresso(t) {
  const surf = 2955 + 38 - 72 * shotLevel(t);
  const head = E.inQ(prog(t, 10.15, 10.32)), tail = E.inQ(prog(t, 11.45, 11.6));
  if (head > 0 && tail < 1) [[443, 447], [457, 453]].forEach(([x0, x1], k) => {
    const pts = []; for (let j = 0; j <= 10; j++) { const s = j / 10; pts.push([lerp(x0, x1, s) + Math.sin(s * 9 + t * 30 + k) * 1.2, lerp(2872, surf, s)]); }
    ink(pts, { p0: tail, p: head, color: COLOR.beanCrease, w: 5, jit: .8, id: 191 + k });
  });
  // 끝나고 방울 똑똑
  [11.62, 11.76, 11.9].forEach((t0, k) => {
    const u = prog(t, t0, t0 + .14);
    if (u > 0 && u < 1) { const x = k % 2 ? 457 : 443, y = lerp(2872, surf, E.inQ(u));
      const d = xf(DROP, { x, y, s: .7 }); fillPts(d, COLOR.beanCrease); }
    const r = prog(t, t0 + .14, t0 + .3);
    if (r > 0 && r < 1) ink(G.ell(k % 2 ? 457 : 443, surf + 1, 6 + 16 * r, 2 + 3 * r, 0, Math.PI * 2), { id: 195 + k, w: 2, color: COLOR.crema, alpha: 1 - r, over: false });
  });
}

function drawBigGlass(t) {
  const q = (s, e) => E.io(prog(t, s, e));
  fillPts(BG.inner, COLOR.ice, .22 * clamp(q(12.3, 12.95) * 2 - 1));
  // 찬물 + 커피
  const wl = waterLevel(t);
  if (wl !== null) {
    const amp = waveAmp(t), surf = [];
    for (let x = 640 - hw(wl) + 3; x <= 640 + hw(wl) - 3; x += 12) surf.push([x, wl + Math.sin(x * .045 + t * 8) * amp * Math.sin((x - 515) / 250 * Math.PI)]);
    const poly = [...surf, [742, 3967], [538, 3967]];
    fillPts(poly, COLOR.water);
    const cf = E.io(prog(t, 15.78, 16.95));
    if (cf > 0) {
      const yC = lerp(3968, wl - 10, cf), g = ctx.createLinearGradient(0, yC - 45, 0, yC + 20);
      g.addColorStop(0, `rgba(${COLOR.coffee},0)`); g.addColorStop(1, `rgba(${COLOR.coffee},0.9)`);
      fillPts(poly, g);
    }
    ink(dense(surf), { id: 201, color: COLOR.iceLine, w: 3, jit: 1, over: false, alpha: .8 });
    // 소용돌이
    const sa = prog(t, 15.95, 16.2) * (1 - prog(t, 16.9, 17.4));
    if (sa > 0) for (let j = 0; j < 2; j++) ink(G.ell(640, 3880 - j * 55, 78 - j * 18, 12, t * 5 + j * 2, 4.4), { id: 205 + j, color: COLOR.ice, w: 3, alpha: .85 * sa, over: false });
  }
  // 얼음
  TL.ice.forEach((t0, k) => {
    const st = iceState(ICE[k], t0, t); if (!st) return;
    const T = { x: st.x, y: st.y, r: st.r, wx: st.wx || 1, wy: st.wy || 1 };
    const o = xf(CUBE.out, T);
    fillPts(o, COLOR.ice, .9);
    ink(o, { id: 211 + k * 3, color: COLOR.iceLine, jit: 1.5 });
    ink(xf(CUBE.f1, T), { id: 212 + k * 3, color: '#ffffff', w: 3.5, over: false, alpha: .9 });
    ink(xf(CUBE.f2, T), { id: 213 + k * 3, color: COLOR.iceLine, w: 2.5, over: false, alpha: .7 });
    // 물방울 튐
    const v = t - t0 - .22;
    if (v > 0 && v < .4) for (let d = 0; d < 7; d++) {
      const ang = -Math.PI / 2 + (d - 3) * .38, sp = 190 + rnd(k * 7 + d, 51) * 130;
      const x = ICE[k].x + Math.cos(ang) * sp * v, y = ICE[k].y - 30 + Math.sin(ang) * sp * v + 700 * v * v;
      const dr = xf(DROP, { x, y, s: .8 * (1 - v / .4) + .2 });
      fillPts(dr, COLOR.ice); ink(dr, { id: 230 + d, color: COLOR.iceLine, w: 2, jit: .6, over: false });
    }
  });
  // 찬물 줄기
  if (t > TL.water[0] && t < TL.water[1] + .02) {
    const bottom = wl ?? 3968, yb = lerp(3470, bottom, E.inQ(prog(t, 14.2, 14.33))), yt = lerp(3470, bottom, E.inQ(prog(t, 15.0, 15.15)));
    if (yb - yt > 2) {
      const l = [], r = [];
      for (let j = 0; j <= 8; j++) { const y = lerp(yt, yb, j / 8), wv = Math.sin(y * .05 + t * 20) * 1.5; l.push([649 + wv, y]); r.push([661 + wv, y]); }
      fillPts([...l, ...r.reverse()], COLOR.water); r.reverse();
      ink(dense(l), { id: 241, color: COLOR.iceLine, w: 2.5, jit: 1, over: false });
      ink(dense(r), { id: 242, color: COLOR.iceLine, w: 2.5, jit: 1, over: false });
    }
  }
  // 빨대
  if (t >= TL.straw[0]) {
    const s = prog(t, 17.25, 17.42), dt = t - 17.42;
    const r = .2 + (dt > 0 ? .14 * Math.sin(dt * 30) * Math.exp(-dt * 7) : 0);
    const T = { x: 700, y: 3945 - 560 * (1 - E.inQ(s)), r };
    fillPts(xf(ST.fill, T), COLOR.ice, .6);
    ST.stripes.forEach((p, k) => ink(xf(p, T), { id: 250 + k, color: COLOR.iceLine, w: 3, jit: 1, over: false }));
    ink(xf(ST.L, T), { id: 261 }); ink(xf(ST.R, T), { id: 262 }); ink(xf(ST.top, T), { id: 263, w: 3 });
  }
  // 유리잔 윤곽
  ink(BG.left, { p: q(12.3, 12.5), id: 271 });
  ink(BG.bottom, { p: q(12.45, 12.6), id: 272 });
  ink(BG.right, { p: q(12.55, 12.75), id: 273 });
  ink(BG.rim, { p: q(12.7, 12.95), id: 274 });
  ink(BG.base, { p: q(12.8, 12.95), id: 275 });
  ink(BG.hl1, { p: q(12.85, 12.95), id: 276, color: '#ffffff', w: 5, over: false, alpha: .8 });
  ink(BG.hl2, { p: q(12.88, 12.95), id: 277, color: '#ffffff', w: 4, over: false, alpha: .8 });
  // 커피 붓는 줄기
  const head = E.inQ(prog(t, 15.72, 15.86)), tail = prog(t, 16.4, 16.55);
  if (head > 0 && tail < 1) {
    const P = shotPose(t), [[lx, ly]] = xf([[38, -40]], { x: P.x, y: P.y, r: P.r });
    const sy = (wl ?? 3968) - 2;
    const c = G.bez([lx, ly], [lx + 40, ly], [612, lerp(ly, sy, .4)], [612, sy]);
    ink(c, { p0: tail, p: head, color: `rgb(${COLOR.coffee})`, w: 8, jit: 1, id: 281 });
  }
  // 물방울 맺힘
  DROPLETS.forEach((d, k) => {
    const u = prog(t, 17.55 + k * .042, 17.55 + k * .042 + .15); if (u <= 0) return;
    const T = { x: d.x, y: d.y, s: d.s * E.outBack(u) };
    const o = xf(DROP, T);
    fillPts(o, 'rgba(255,255,255,0.75)'); ink(o, { id: 290 + k, color: COLOR.iceLine, w: 2, jit: .6, over: false });
  });
}
function drawSparkles(t) {
  for (let k = 0; k < 10; k++) {
    const t0 = 17.35 + k * .03, p = E.outQ(prog(t, t0, t0 + .14)); if (p <= 0) continue;
    const a = k * Math.PI * 2 / 10 + .3, ca = Math.cos(a), sa = Math.sin(a);
    const x0 = 640 + ca * 180, y0 = 3810 + sa * 235, len = 40 * (.75 + .25 * Math.sin(t * 9 + k));
    ink(G.line([x0, y0], [x0 + ca * len, y0 + sa * len]), { p, id: 310 + k, w: 4 });
  }
}

function labelGeom(i) {
  const L = LAYOUT.labels[i]; setFont(L.size);
  const tw = ctx.measureText(TEXT.labels[i]).width, d = L.size * .82, gap = L.size * .24;
  const left = L.x - (d + gap + tw) / 2;
  return { L, tw, d, cx: left + d / 2, tx: left + d + gap };
}
function drawLabel(i, t) {
  const { L, tw, d, cx, tx } = labelGeom(i);
  if (t < L.t) return;
  const tText = L.t + .25, tDone = tText + Array.from(TEXT.labels[i]).length / 10;
  const hp = E.outQ(prog(t, tDone, tDone + .35));
  if (hp > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ink(G.line([tx - 6, L.y + L.size * .34], [tx + tw + 8, L.y + L.size * .3]), { p: hp, color: COLOR.highlight, w: L.size * .3, jit: 1.5, over: false, id: 400 + i });
    ctx.globalCompositeOperation = 'source-over';
  }
  ink(G.ell(cx, L.y, d / 2, d / 2 * .95), { p: E.io(prog(t, L.t, L.t + .3)), id: 410 + i, w: 3.5 });
  write(String(i + 1), cx, L.y + 2, L.size * .62, L.t + .12, t);
  write(TEXT.labels[i], 0, L.y, L.size, tText, t, { left: tx });
}
function drawChecks(t) {
  for (let i = 0; i < 4; i++) {
    const t0 = TL.checks[0] + i * .125, p = E.outQ(prog(t, t0, t0 + .14)); if (p <= 0) continue;
    const { L, tw, tx } = labelGeom(i), k = L.size / 74, x = tx + tw + 30 * k, y = L.y;
    ink(G.poly([[x, y], [x + 14 * k, y + 18 * k], [x + 48 * k, y - 28 * k]]), { p, color: COLOR.check, w: 6, id: 420 + i });
  }
}
function drawEnding(t) {
  const T = LAYOUT.endTitle, S = LAYOUT.signature;
  const r = write(TEXT.endTitle, T.x, T.y, T.size, T.t, t);
  const hp = E.outQ(prog(t, r.done + .1, r.done + .5));
  if (hp > 0) {
    ctx.globalCompositeOperation = 'multiply';
    ink(G.line([r.left - 6, T.y + T.size * .34], [r.left + r.width + 6, T.y + T.size * .3]), { p: hp, color: COLOR.highlight, w: T.size * .28, jit: 1.5, over: false, id: 430 });
    ctx.globalCompositeOperation = 'source-over';
    // 다시 그려 글자가 형광펜 위로 오게
    write(TEXT.endTitle, T.x, T.y, T.size, T.t, t);
  }
  write(TEXT.signature, S.x, S.y, S.size, S.t, t, { color: '#5b4a3e' });
}

function drawScene(t) {
  drawTitle(t);
  drawTrails(t);
  drawBowl(t);
  drawMachine(t);
  drawFlyingBeans(t);
  drawGrinder(t);
  drawPortafilter(t);
  drawGrains(t);
  drawTamper(t);
  drawClick(t);
  drawShot(t);
  drawEspresso(t);
  drawBigGlass(t);
  drawSparkles(t);
  for (let i = 0; i < 5; i++) drawLabel(i, t);
  drawChecks(t);
  drawEnding(t);
}

/* =====================================================================
   8. render(t) — 이 함수 하나로 모든 순간이 결정됨
   ===================================================================== */
function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  VAR = Math.floor(t * 12) % 3;
  const cam = camAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = COLOR.desk; ctx.fillRect(0, 0, W, H);
  // 뒤 낙서 층: 카메라보다 느리게
  setCam({ x: cam.x * PARALLAX.pos, y: cam.y * PARALLAX.pos, z: Math.pow(cam.z, PARALLAX.zoom) });
  drawDoodles();
  setCam(cam);
  drawPaper(cam);
  drawScene(t);

  // 합성 (휙 구간에서만 모션 블러)
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.globalAlpha = 1;
  main.fillStyle = COLOR.desk; main.fillRect(0, 0, W, H);
  main.drawImage(buf, 0, 0);
  if (cam.mode === 'whip') {
    const pc = camAt(Math.max(0, t - 1 / 60));
    const dx = (cam.x - pc.x) * cam.z, dy = (cam.y - pc.y) * cam.z, v = Math.hypot(dx, dy);
    if (v > 3) {
      const N = Math.min(10, Math.ceil(v / 5)), sp = 1.6;
      for (let k = 1; k < N; k++) { const f = k / (N - 1); main.globalAlpha = 1 / (k + 1); main.drawImage(buf, dx * f * sp, dy * f * sp); }
      main.globalAlpha = 1;
    }
  }
  // 가장자리 갈색 비네팅
  const g = main.createRadialGradient(W / 2, H / 2, 560, W / 2, H / 2, 1180);
  g.addColorStop(0, 'rgba(78,48,24,0)'); g.addColorStop(1, COLOR.vignette);
  main.fillStyle = g; main.fillRect(0, 0, W, H);
}
window.render = render;

/* =====================================================================
   9. 재생 컨트롤
   ===================================================================== */
const btn = document.getElementById('play'), seek = document.getElementById('seek'), timeEl = document.getElementById('time');
let T = 0, playing = true, last = null, dirty = true;
function fit() {
  const s = Math.min((innerWidth - 16) / W, (innerHeight - 16 - 50 - 10) / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  document.getElementById('bar').style.width = Math.max(260, W * s) + 'px';
}
addEventListener('resize', fit); fit();
function setPlaying(p) { playing = p; btn.textContent = p ? '❚❚' : '▶'; last = null; }
btn.onclick = () => setPlaying(!playing);
seek.oninput = () => { T = +seek.value; setPlaying(false); dirty = true; };
addEventListener('keydown', e => { if (e.code === 'Space' && e.target !== btn) { e.preventDefault(); setPlaying(!playing); } });
function loop(ts) {
  if (playing) { if (last !== null) T = (T + (ts - last) / 1000) % DUR; last = ts; seek.value = T; dirty = true; }
  if (dirty) { render(T); timeEl.textContent = T.toFixed(2) + ' / 22'; dirty = false; }
  requestAnimationFrame(loop);
}
render(0);
const start = () => { dirty = true; requestAnimationFrame(loop); };
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('700 40px Gaegu'), new Promise(r => setTimeout(r, 2500))]).then(start, start);
else start();
</script>
